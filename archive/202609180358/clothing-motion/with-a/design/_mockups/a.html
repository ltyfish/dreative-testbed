<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;0,6..96,900;1,6..96,400&family=IBM+Plex+Mono:wght@400;500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0B0B0C;--pap:#EDEAE4;--dim:#8A867E;--line:rgba(237,234,228,.16)}
body{background:var(--ink);color:var(--pap);font-family:Archivo,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.disp{font-family:'Bodoni Moda',serif;font-weight:900;line-height:.82;letter-spacing:-.02em}
section{position:relative}
.nav{position:absolute;top:0;left:0;right:0;z-index:9;display:flex;justify-content:space-between;align-items:center;padding:26px 48px;text-shadow:0 1px 14px rgba(0,0,0,.6)}
.nav ul li{color:#D9D4CB}
.nav .l{font-family:'Bodoni Moda',serif;font-weight:700;font-size:19px;letter-spacing:.02em}
.nav ul{display:flex;gap:28px;list-style:none}
.hero{height:900px;overflow:hidden}
.hero .cloth{position:absolute;inset:-8% 0 0;background:url(../_src/cloth/jean.jpg) center/cover;filter:contrast(1.06) brightness(.78)}
.hero .vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,rgba(11,11,12,0) 28%,rgba(11,11,12,.88) 100%)}
.hero .mid{position:absolute;left:0;right:0;top:296px;text-align:center}
.hero h1{font-size:168px}
.hero h1 em{font-style:italic;font-weight:400}
.hero .sub{text-align:center;margin-top:28px;font-size:15px;color:#D9D4CB}
.hero .strip{position:absolute;left:48px;right:48px;bottom:34px;display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px}
.hero .cut{position:absolute;left:50%;top:120px;transform:translateX(-50%);width:430px;opacity:.95}
.scrollhint{position:absolute;left:50%;bottom:100px;transform:translateX(-50%)}
.big{font-family:'Bodoni Moda',serif;font-weight:900;font-size:118px;line-height:.85;letter-spacing:-.03em;color:#212124;padding:64px 48px 10px}
.run{position:relative;display:grid;grid-template-columns:1fr 500px 1fr;align-items:center;min-height:600px;border-top:1px solid var(--line)}
.run .ribbon{height:600px;position:relative;overflow:hidden}
.run .ribbon img{position:absolute;width:100%;height:150%;object-fit:cover;top:-25%}
.run .ribbon svg{position:absolute;inset:0;width:100%;height:100%}
.run .txt{padding:0 56px}
.run h2{font-family:'Bodoni Moda',serif;font-weight:700;font-size:54px;line-height:1.02;letter-spacing:-.02em;margin-top:6px}
.run .txt p{margin-top:16px;font-size:15px;line-height:1.55;color:#C9C4BB;max-width:38ch}
.run .meta{margin-top:24px}
.dis{height:520px;position:relative;overflow:hidden;background:#0B0B0C}
#mosaic{position:absolute;inset:0;display:block}
.dis .lab{position:absolute;left:48px;bottom:30px;z-index:3}
.dis .lab b{display:block;font-family:'Bodoni Moda',serif;font-weight:900;font-size:62px;line-height:.9;color:#EDEAE4;margin-top:6px}
.shop{padding:64px 48px 90px;border-top:1px solid var(--line)}
.shophead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px}
.shophead h3{font-family:'Bodoni Moda',serif;font-weight:900;font-size:74px;letter-spacing:-.03em;line-height:.9;margin-top:6px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:none;border:1px solid var(--line);color:#C9C4BB;padding:9px 15px;border-radius:99px}
.filters button.on{background:var(--pap);color:var(--ink);border-color:var(--pap)}
.count{margin:10px 0 26px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:#121214;position:relative;overflow:hidden}
.card .plate{position:relative;aspect-ratio:3/3.4;overflow:hidden}
.card .plate img{width:100%;height:100%;object-fit:cover}
.card .plate svg{position:absolute;inset:0;width:100%;height:100%}
.card .body{padding:16px 18px 20px}
.card .r1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h4{font-family:'Bodoni Moda',serif;font-weight:700;font-size:23px;letter-spacing:-.01em}
.card .pr{font-family:'IBM Plex Mono',monospace;font-size:15px}
.card .fab{margin-top:8px;font-size:12.5px;color:#9A958C;line-height:1.45}
.sizes{display:flex;gap:6px;margin-top:14px}
.sizes span{flex:1;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;padding:9px 0;border:1px solid var(--line);color:#C9C4BB}
.sizes span.sel{background:var(--pap);color:var(--ink);border-color:var(--pap)}
.sizes span.out{color:#6E6961;border-color:rgba(237,234,228,.09);background:repeating-linear-gradient(135deg,rgba(237,234,228,.05) 0 3px,transparent 3px 6px)}
.atb{margin-top:10px;width:100%;padding:12px;background:none;border:1px solid var(--pap);color:var(--pap);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.atb.off{border-color:var(--line);color:#57534D}
.bag{position:absolute;right:48px;top:64px;width:326px;background:#121214;border:1px solid var(--line);padding:20px;z-index:8}
.bagline{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.bagline i{color:#7C776F;font-family:'IBM Plex Mono',monospace;font-size:11px;font-style:normal}
.sub{display:flex;justify-content:space-between;margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:13px}
.prog{height:3px;background:rgba(237,234,228,.12);margin:14px 0 8px}
.prog i{display:block;height:3px;width:100%;background:var(--pap)}
.co{margin-top:16px;width:100%;padding:13px;background:var(--pap);color:var(--ink);border:0;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.end{border-top:1px solid var(--line);padding:70px 48px 0}
.twocol{display:grid;grid-template-columns:1.05fr 1fr;gap:60px}
.chart{width:100%;border-collapse:collapse;margin-top:22px}
.chart th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:0 0 10px;border-bottom:1px solid var(--line)}
.chart td{padding:15px 0;border-bottom:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:14px}
.chart td:first-child{font-family:'Bodoni Moda',serif;font-weight:700;font-size:22px}
h5{font-family:'Bodoni Moda',serif;font-weight:900;font-size:38px;letter-spacing:-.02em;line-height:1.08;padding-bottom:2px;margin-top:8px}
.list{margin-top:20px;display:grid;gap:14px}
.list p{font-size:14.5px;line-height:1.6;color:#C3BEB5;padding-left:20px;border-left:1px solid var(--line)}
.revs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px}
.rev{background:#121214;padding:24px}
.rev q{display:block;font-family:'Bodoni Moda',serif;font-size:19px;line-height:1.36;font-style:italic}
.rev .who{margin-top:16px}
.about{margin-top:76px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;border-top:1px solid var(--line);padding-top:26px}
.about p{font-size:14.5px;line-height:1.6;color:#C3BEB5}
.about b{display:block;font-family:'Bodoni Moda',serif;font-weight:900;font-size:56px;line-height:1;margin-bottom:10px;color:#EDEAE4}
.ft{position:relative;height:290px;margin-top:64px;overflow:hidden}
.ft img{width:100%;height:100%;object-fit:cover;filter:brightness(.45)}
.ft b{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font-family:'Bodoni Moda',serif;font-weight:900;font-size:132px;letter-spacing:-.03em;color:#EDEAE4;mix-blend-mode:difference}
.foot{border-top:1px solid var(--line);padding:22px 0 30px;display:flex;justify-content:space-between}

@media(max-width:520px){
 .nav{padding:16px}.nav ul{gap:14px}.nav ul li:nth-child(-n+3){display:none}
 .hero{height:660px}.hero h1{font-size:60px}.hero .mid{top:190px}
 .hero .cut{width:230px;top:90px}.hero .sub{font-size:13.5px;padding:0 24px}
 .hero .strip{left:16px;right:16px;font-size:9px}.hero .strip span:nth-child(2){display:none}
 .big{font-size:52px;padding:34px 16px 6px}
 .run{grid-template-columns:1fr;min-height:0}
 .run .txt{padding:22px 16px;order:2!important}
 .run .txt:empty{display:none}
 .run .ribbon{height:380px;order:1!important}
 .run h2{font-size:32px}
 .dis{height:300px}.dis .lab{left:16px;bottom:18px}.dis .lab b{font-size:34px}
 .shop{padding:34px 16px 60px}
 .shophead h3{font-size:40px}
 .filters{gap:6px}.filters button{font-size:10px;padding:8px 11px}
 .grid{grid-template-columns:1fr}
 .bag{position:fixed;right:0;left:0;bottom:0;top:auto;width:auto;border-left:0;border-right:0;border-bottom:0;z-index:20}
 .end{padding:40px 16px 0}.twocol{grid-template-columns:1fr;gap:40px}
 h5{font-size:28px}.revs{grid-template-columns:1fr}
 .about{grid-template-columns:1fr;gap:28px}.about b{font-size:42px}
 .ft{height:170px;margin-top:40px}.ft b{font-size:44px;bottom:-6px}
 .foot{font-size:9px}
}
</style></head><body>
<div id="app"></div>
<script src="silhouettes.js"></script><script src="data.js"></script>
<script>
const cut=(id,fill,stroke)=>`<svg viewBox="0 0 200 270" preserveAspectRatio="xMidYMid meet"><defs><mask id="m_${id}_${fill.length}"><rect width="200" height="270" fill="white"/><path d="${SIL[id]}" fill="black"/></mask></defs><rect width="200" height="270" fill="${fill}" mask="url(#m_${id}_${fill.length})"/><path d="${SIL[id]}" fill="none" stroke="${stroke||'rgba(237,234,228,.32)'}" stroke-width="0.6"/><path d="${SIL_EXTRA[id]||''}" fill="none" stroke="${stroke||'rgba(237,234,228,.3)'}" stroke-width="0.6"/></svg>`;
const sel={oxford:'M',chore:'L',knit:'M'};
function card(g){
 const sz=SIZES.map(s=>`<span class="${g.s.includes(s)?'out':(sel[g.id]===s?'sel':'')}">${s}</span>`).join('');
 return `<article class="card"><div class="plate"><img src="../_src/cloth/${g.id}.jpg">${cut(g.id,'#0B0B0C')}</div>
 <div class="body"><div class="r1"><h4>${g.n}</h4><div class="pr">£${g.p}</div></div>
 <div class="fab">${g.f}</div><div class="mono" style="margin-top:8px">${g.col.join(' / ')}</div>
 <div class="sizes">${sz}</div>
 <button class="atb ${sel[g.id]?'':'off'}">${sel[g.id]?'Add to bag — size '+sel[g.id]:'Choose a size'}</button></div></article>`;}

const runs=[['jean','Straight Jean','13.5oz rigid cotton denim, selvedge. Rigid, not stretch. It will feel stiff for two weeks and then fit only you.','£98 · Rinse / Mid wash / Ecru'],
['cardigan','Shawl Cardigan','70% wool, 30% alpaca. A heavy shawl collar that stays up without a scarf. Hand wash or wool cycle only.','£155 · Charcoal / Camel'],
['overshirt','Wool Overshirt','80% wool, 20% nylon, brushed. Warm enough to be the only layer down to about 8°C. Sized to go over a shirt.','£210 · Charcoal / Oat']];

document.getElementById('app').innerHTML=`
<nav class="nav"><div class="l">Marlow &amp; Vale</div><ul class="mono"><li>Shop</li><li>Sizing</li><li>Care</li><li>Leeds</li><li>Bag (2)</li></ul></nav>

<section class="hero" id="s-hero"><div class="cloth"></div><div class="vig"></div>
 <div class="cut"><svg viewBox="0 0 200 270"><path d="${SIL.chore}" fill="rgba(11,11,12,.42)" stroke="rgba(237,234,228,.55)" stroke-width="0.7"/><path d="${SIL_EXTRA.chore}" fill="none" stroke="rgba(237,234,228,.4)" stroke-width="0.6"/></svg></div>
 <div class="mid"><h1 class="disp">CUT FROM<br><em>one cloth</em></h1>
 <div class="sub">Clothes made in four factories we have been to, sold at one price all year.</div></div>
 <div class="mono scrollhint">Scroll — the bolt unrolls</div>
 <div class="strip mono"><span>Marlow &amp; Vale · Leeds</span><span>Nine garments</span><span>Never a sale</span></div>
</section>

<section class="bolt" id="s-bolt">
 <div class="big">THE BOLT</div>
 ${runs.map((r,i)=>`<div class="run">
   <div class="txt" style="${i%2?'order:3':''}"><div class="mono">0${i+1} — Cloth</div><h2>${r[1]}</h2><p>${r[2]}</p>
   <div class="meta mono">${r[3]}</div></div>
   <div class="ribbon"><img src="../_src/cloth/${r[0]}.jpg">${cut(r[0],'rgba(11,11,12,.72)')}</div>
   <div class="txt" style="${i%2?'order:1':''}"></div></div>`).join('')}
</section>

<section class="dis" id="s-dis"><canvas id="mosaic"></canvas>
 <div class="lab"><div class="mono">The weave resolves into the grid</div><b>NINE GARMENTS</b></div></section>

<section class="shop" id="s-shop">
 <div class="bag"><div class="mono">Your bag — 2 items</div>
  <div class="bagline"><span>The Oxford Shirt, size M</span><span>£78 &nbsp;<i>×</i></span></div>
  <div class="bagline"><span>Lambswool Crew, size M</span><span>£135 &nbsp;<i>×</i></span></div>
  <div class="sub"><span>Subtotal</span><span>£213.00</span></div>
  <div class="prog"><i></i></div>
  <div class="mono">Delivery free — over £100</div>
  <div class="sub"><span>Total</span><span>£213.00</span></div>
  <button class="co">Checkout</button></div>
 <div class="shophead"><div><div class="mono">The shop</div><h3>EVERYTHING<br>WE MAKE</h3></div></div>
 <div class="filters"><button class="on">All (9)</button><button>Shirts (2)</button><button>Outerwear (2)</button><button>Trousers (3)</button><button>Knitwear (2)</button></div>
 <div class="count mono">Showing 9 of 9 garments</div>
 <div class="grid">${G.map(card).join('')}</div>
</section>

<section class="end" id="s-end">
 <div class="twocol">
  <div><div class="mono">Sizing</div><h5>Measured on the body,<br>in centimetres.</h5>
   <table class="chart"><tr><th>Size</th><th>Chest</th><th>Waist</th><th>Sleeve</th></tr>
   ${CHART.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table>
   <p style="margin-top:18px;font-size:14.5px;line-height:1.6;color:#C3BEB5">Between two sizes? Everything except the knitwear is cut with room, so take the smaller one.</p></div>
  <div><div class="mono">Care</div><h5>How to keep it.</h5><div class="list">${CARE.map(c=>`<p>${c}</p>`).join('')}</div>
   <div class="mono" style="margin-top:44px">Shipping &amp; returns</div><h5>Where it goes.</h5><div class="list">${SHIP.map(c=>`<p>${c}</p>`).join('')}</div></div>
 </div>
 <div style="margin-top:76px"><div class="mono">Worn in</div><h5>Three people who bought something.</h5>
 <div class="revs">${REV.map(r=>`<div class="rev"><q>${r[2]}</q><div class="who mono">${r[0]} · bought ${r[1]}</div></div>`).join('')}</div></div>
 <div class="about">${ABOUT.map((a,i)=>`<p><b>${['11','4','0'][i]}</b>${a}</p>`).join('')}</div>
 <div class="ft"><img src="../_src/cloth/overshirt.jpg"><b>MARLOW &amp; VALE</b></div>
 <div class="foot mono"><span>Leeds, England</span><span>The price is the price all year</span><span>© 2026</span></div>
</section>`;

(function(){
 const c=document.getElementById('mosaic'),W=1440,H=520;
 c.width=W*2;c.height=H*2;c.style.width=W+'px';c.style.height=H+'px';
 const x=c.getContext('2d');x.scale(2,2);
 const im=new Image();im.src='../_src/cloth/chore.jpg';
 im.onload=()=>{
  const bands=14, off=document.createElement('canvas'), oc=off.getContext('2d');
  for(let b=0;b<bands;b++){
   const t=b/(bands-1), bs=Math.max(2,Math.round(2+Math.pow(t,2.2)*120));
   const y0=Math.round(b*H/bands), hh=Math.round((b+1)*H/bands)-y0;
   const cw=Math.max(1,Math.ceil(W/bs)), ch=Math.max(1,Math.ceil(hh/bs));
   off.width=cw;off.height=ch;oc.imageSmoothingEnabled=true;
   const sy=Math.floor((0.15+0.6*t)*im.height*0.6);
   oc.drawImage(im,0,sy,im.width,Math.max(8,im.height*hh/H*1.4),0,0,cw,ch);
   x.save();x.imageSmoothingEnabled=false;
   x.globalAlpha=1;x.filter=`brightness(${(1-t*0.42).toFixed(2)})`;
   x.drawImage(off,0,y0,cw*bs,ch*bs);
   x.restore();
   if(bs>10){x.strokeStyle='rgba(11,11,12,.45)';x.lineWidth=1;
    for(let gx=0;gx<=W;gx+=bs)  {x.beginPath();x.moveTo(gx,y0);x.lineTo(gx,y0+hh);x.stroke();}
    for(let gy=y0;gy<=y0+hh;gy+=bs){x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke();}}
  }
  const g=x.createLinearGradient(0,H*0.55,0,H);g.addColorStop(0,'rgba(11,11,12,0)');g.addColorStop(1,'rgba(11,11,12,.72)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  window.__mosaicDone=true;
 };
})();
</script></body></html>
