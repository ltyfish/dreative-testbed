  scope:
    substantial: true
    projectKind: redesign
    routes:
      - /
      - /shipping
      - /returns
      - /privacy
    requiredFunctionality:
      - Five in-page navigation links and logo navigation.
      - Six coffee add-to-cart actions with visible non-blocking feedback.
      - Contact email and message fields with invalid and success states.
      - Subscription CTA and four working footer destinations.
      - Keyboard, touch and pointer operation for every defining mechanism.
    preservedContentAndBrand:
      - All visible Northwind copy, six coffees, four brew steps, three reviews and four statistics.
      - Northwind Coffee Roasters, Bergen, the 1962 Probat, partner-farm and freshness claims.
      - Existing product prices and contact success meaning.
    dependencyInstallationAllowed: true
    performanceConstraints:
      - Initial route under 2.8 MB compressed excluding cached fonts.
      - Lazy 3D chunk under 900 KB compressed and total media under 4 MB.
      - Desktop average at least 55 FPS; 390px average at least 45 FPS.
      - CLS below 0.1 and no horizontal overflow at 320px.
    successCriteria:
      - All selected treatments are materially demonstrated, evidence-backed and independently checked before
        DREATIVE_FINALIZED.
      - Substantially elevate Roast Ledger into an award-level spatial, cinematic and interactive experience.
      - Generic fades, decorative parallax, cursor gimmicks, primitives, particles, unchanged demos, hero-only
        effects, video rectangles and ordinary card hovers do not count.
      - The prototype proves continuity, structural scroll, spatial media, cinematic pacing, experimental
        interaction, responsive and accessible parity, performance and browser verification.
