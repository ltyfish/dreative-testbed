  experimentalPeaks:
    - id: origin-calibration
      chapter: beans
      mechanismFamily: spatial selector and media reconstruction
      plannedBehaviour: Six origin plates occupy calibrated apertures; input rotates depth and reconstructs the
        selected plate into a product dossier.
      startState: One batch is centered while five origins remain peripheral but legible.
      activeState: Input changes camera, material, media slices and pending dossier.
      resolution: Selected origin locks into the front aperture and updates dossier, price and cart target.
      inputRelationship: Pointer drag, swipe, arrow keys and explicit buttons drive one bounded index.
      mobileStrategy: A snap rail drives simplified 3D and always-visible dossier controls.
      reducedMotionStrategy: Direct cuts switch among authored resolved origin plates.
      fallbackState: Semantic six-origin selector with posters and working cart buttons.
      prototypeRiskFamily: 3D interaction, media transformation and input parity.
      acceptance:
        - All inputs reach identical labeled state.
        - Media changes internally.
        - Peak remains special under neutral styling.
    - id: brew-transmutation
      chapter: brew-guide
      mechanismFamily: shared-object handoff and cinematic layout transformation
      plannedBehaviour: The selected ring leaves the product berth, flattens into four measured pour phases and
        closes as a subscription stamp.
      startState: Selected ring exits beans with origin color and identity intact.
      activeState: Four apertures unfold as camera, type, light, depth and layout change.
      resolution: The score becomes a readable guide and then a subscription seal.
      inputRelationship: Vertical scroll and direct step controls reach the same semantic phases.
      mobileStrategy: Four short sticky beats replace the long desktop transformation.
      reducedMotionStrategy: Four authored panels preserve identity and order without travel.
      fallbackState: A semantic four-step guide with the selected batch mark.
      prototypeRiskFamily: Cross-section object handoff and responsive cinematic continuity.
      acceptance:
        - One object and origin persist.
        - At least five channels change.
        - Mobile and reduced motion retain the arc.
  prototypeContracts:
    - id: roast-stage-vertical-slice
      riskFamily: Combined scroll orchestration, WebGL media, interaction and responsive continuity.
      mechanismId: roast-stage
      required: true
      uncertainty: Whether one scoped timeline and one persistent stage can deliver cross-section identity, media
        transformation, spatial selection, cinematic pacing and complete input parity within budgets.
      acceptanceConditions:
        - One mounted stage persists through actual hero, story, beans, brew and subscription states.
        - Structural transformation has start, midpoint, end, reverse, rapid-scroll, refresh and release
          evidence.
        - Chronometer has recognizable industrial form, material depth, camera travel and fallback.
        - A recording shows setup, escalation, peak, rest, handoff and resolution.
        - Origin calibration changes camera, media, dossier and cart by pointer, touch, keyboard and buttons.
        - Desktop and 390px are authored without overflow or occlusion.
        - Reduced motion retains purposeful resolved compositions.
        - Desktop averages at least 55 FPS and mobile at least 45 FPS.
        - Dreative browser verification completes with controlled evidence.
      maximumScope: .dreative/prototypes/roast-stage-vertical-slice with actual hero, one post-hero peak, 390px and
        reduced-motion paths.
      failureImplications: Iterate once; if still failing, use only the matching approved fallback with observed
        trigger or request a material plan change.
