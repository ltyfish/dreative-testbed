  packagePlan:
    assets:
      - Roaster plate and derivatives.
      - Six origin plates and masks.
      - Chronometer posters and fallback states.
      - Self-hosted fonts.
      - Original material maps.
    rightsAndSources:
      - Record source URL, author, license, retrieval date and derivative permission for every sourced asset.
      - Generated images retain prompt and output provenance.
      - GSAP uses its current standard no-charge license terms.
      - Lenis, Three, R3F, React Bits and Vanta references are MIT; preserve notices when code is adapted.
    placeholderRestrictions:
      - No repeated generic coffee stock.
      - No final placeholder.
      - No generic primitive or Vanta preset.
      - No untreated video rectangle.
      - No asset without rights record.
    derivatives:
      - Responsive AVIF and WebP crops.
      - Origin masks.
      - Chronometer posters.
      - Pre-rendered motion states.
      - WOFF2 subsets.
    mobileAssetStrategy: One active 390px media surface; images under 250 KB; DPR 1.5; lazy offscreen assets;
      simplified stage or pre-rendered states.
    mechanismPackages:
      - gsap@3.15.0 for structural timelines and ScrollTrigger.
      - "@gsap/react@2.1.2 for scoped React cleanup."
      - three@0.185.1 for the WebGL scene and materials.
      - "@react-three/fiber@8.18.0 for React 18 scene lifecycle."
      - lenis@1.3.25 for prototype comparison only; production requires measured benefit.
      - sharp@0.35.3 for development-only image derivatives.
    installPermission: true
    preflightResults:
      - Chrome and Dreative browser runner are available.
      - WebGL and Canvas remain unverified until the prototype browser run.
      - Video generation is unavailable, so generated video is not promised.
      - Image generation and search are available.
      - No 3D authoring tool is confirmed; original procedural inorganic geometry is approved.
      - FFmpeg is missing and unnecessary for the selected pre-rendered image-state route.
    prototypeProof:
      - Install mechanism groups transactionally after approval.
      - Probe GSAP and R3F first.
      - Add Lenis only to a comparison path.
      - Reject Lenis unless continuity improves while anchors, keys, reduced motion and mobile remain correct.
      - Verify Sharp outputs, bytes and browser decode.
  videoDeliveryDecision:
    decision: frame-sequence-or-prerendered-motion
    reason: Video generation is not confirmed and sourced footage would weaken identity; deterministic chronometer
      states provide the cinematic fallback while live DOM and WebGL provide interaction.
    processingRoute: Render fixed R3F states after the prototype and optimize with sharp@0.35.3.
    mobileStrategy: Use bounded 390px states only if simplified live R3F misses the mobile budget.
    reducedMotionStrategy: Use authored resolved stills with no autoplay or scrub.
  referenceContract:
    - source: GSAP and ScrollTrigger official documentation
      sourceType: primary documentation
      mechanism: batch-journey and brew-score
      principleExtracted: Scoped reversible timelines, responsive triggers, refresh and pin lifecycle.
      projectSpecificUse: Drive roast states, origin handoff and brew score from one owner.
      brandSpecificTransformation: Mechanical calibration and Northwind chapter semantics replace demos.
      plannedDifferences: No copied layout, palette, timing or selectors.
      packages:
        - gsap@3.15.0
        - "@gsap/react@2.1.2"
      license: GSAP standard no-charge license.
      attributionRequired: false
      risks: Pinning and lifecycle defects require prototype evidence.
    - source: Lenis GitHub repository
      sourceType: MIT repository
      mechanism: prototype-only scroll adapter
      principleExtracted: One interpolated scroll clock synchronized to WebGL and GSAP.
      projectSpecificUse: Comparison probe for velocity continuity and material settling.
      brandSpecificTransformation: Velocity affects roast calibration rather than generic smoothing.
      plannedDifferences: Anchors enabled, no autoRAF, one ticker and native mobile if unstable.
      packages:
        - lenis@1.3.25
      license: MIT
      attributionRequired: true
      risks: Anchor defaults, Safari low-power limits and mobile momentum.
    - source: React Bits GitHub repository
      sourceType: MIT repository
      mechanism: origin-ring interaction vocabulary
      principleExtracted: Bounded inertial input and material response.
      projectSpecificUse: Original coffee calibration controller and dossier state.
      brandSpecificTransformation: Changes content, viewpoint and cart state using Northwind data.
      plannedDifferences: No source, demo styling, assets, timing or layout copied.
      packages: []
      license: MIT with notice if code is adapted.
      attributionRequired: true
      risks: Catalogue-effect soup and originality dilution.
    - source: Vanta GitHub repository
      sourceType: MIT repository
      mechanism: custom instrument material atmosphere
      principleExtracted: A bounded Three shader can provide interactive depth.
      projectSpecificUse: Custom brass heat and Bergen cold-light material within the instrument berth.
      brandSpecificTransformation: No background preset and no Vanta dependency.
      plannedDifferences: Original shader, material, geometry, interaction and section role.
      packages: []
      license: MIT reference only.
      attributionRequired: false
      risks: Generic preset appearance and unnecessary bundle cost.
