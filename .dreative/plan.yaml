      - Origin initial, drag, settled, reverse, rapid, keyboard, touch and reduced.
      - Brew handoff, four phases, resolution, reverse, mobile and reduced.
    mobileTests:
      - 390 authored route and touch flow.
      - 320 no overflow.
      - DPR cap.
      - URL-bar resize.
      - 44px targets.
      - No hover-only information.
    reducedMotionTests:
      - No long pin, scrub, inertia or autoplay.
      - Resolved stage plates.
      - Direct origin selection.
      - Static brew score.
      - Complete functions.
    accessibilityChecks:
      - Semantic landmarks and heading order.
      - Visible focus and logical tabs.
      - Menu trap and focus return.
      - Form labels and error wiring.
      - No overlay interception.
      - Contrast and semantic text.
      - Anchor and keyboard scroll with Lenis on and off.
    performanceChecks:
      - Build and artifact identity.
      - Transfer and chunk bytes.
      - FPS, worst frame, long tasks and CLS.
      - One ticker and renderer.
      - Hidden pause.
      - Context fallback.
      - No overflow.
    mediaNetworkChecks:
      - Every planned file exists and renders.
      - Manifest matches disk and app references.
      - No failed requests.
      - Responsive formats decode.
      - Canvas and media change.
      - Rights and generation records exist.
    criticInputs:
      - Approved contract and matrix.
      - All viewport and reduced-motion captures.
      - Desktop and mobile recordings.
      - Controlled telemetry.
      - Functional and performance summaries.
      - Reference adaptation record.
      - Hero-removed evidence.
    finalizationBlockers:
      - Failed assertion.
      - Missing treatment evidence.
      - Missing viewport or reduced-motion evidence.
      - Broken route, form, cart or anchor.
      - Unapproved fallback.
      - Rights gap.
      - Performance breach.
      - Generic or demo-derived result.
      - Non-independent critic or major issue.
      - Audit failure or missing DREATIVE_FINALIZED.
