  projectDefinition:
    purpose: Turn Northwind into a memorable but usable direct-to-consumer coffee experience and complete Dogfood
      certification.
    targetAudience: Quality-conscious home brewers and gift subscribers who value freshness, provenance and craft.
    primaryUserJourney: Enter through the roast chronometer, understand freshness and sourcing, explore six
      coffees, learn the method, review proof, subscribe or contact the roastery, and reach working policies.
    routes:
      - /
      - /shipping
      - /returns
      - /privacy
    requiredFunctionality:
      - In-page anchors and mobile menu.
      - Six add-to-cart actions.
      - Contact validation and success.
      - Subscription CTA and working legal routes.
      - Back and direct-URL behavior.
    extractedRequirements:
      - Experimental ambition with Full Audit, Required prototype and Dreative Dogfood.
      - All ten treatments selected with UX and Mobile foundational.
      - Exact package and reference contract before source modification.
      - Combined prototype for continuity, scroll, 3D media, cinematic arc, experimental interaction,
        responsiveness and accessibility.
      - No generic or hero-only substitutes.
      - Independent critic and DREATIVE_FINALIZED.
    nonGoals:
      - No production payment backend or account system.
      - No mandatory audio.
      - No direct copying of references or demos.
      - No generic Vanta preset.
    preservedContentOrFunctionality:
      - All existing navigation, brand, story, product, brew, review, subscription and contact copy.
      - Six add-to-cart actions and contact form states.
      - Four footer links, with missing policies created.
  creativeDirection:
    selectedConcept: "Roast Ledger: The Living Batch Record"
    fitRationale: Northwind already speaks through timestamps, batch size, origin contracts and a historic Probat;
      a living instrument turns those facts into the site logic.
    nonGenericQualities: A recognizable industrial roast chronometer persists across chapters; origin imagery
      becomes calibrated material; coffee selection rotates and locks a batch ring; brewing resolves it into
      measured phases.
    visualLanguage: Parchment, oxidized brass, blackened steel, ember orange, Bergen gray, ink registration marks
      and cropped documentary plates.
    compositionStrategy: A persistent stage crosses asymmetric editorial chapters; mechanical peaks alternate with
      full-width reading rests.
    typographyStrategy: Self-hosted Bodoni Moda for theatrical display, Inter for reading and IBM Plex Mono for roast data.
    mediaStrategy: Rights-safe or generated plates are cropped, graded and transformed inside WebGL apertures;
      each coffee retains a distinct origin identity.
    motionInteractionPhilosophy: Mechanical inertia and calibrated settle; scroll, drag, touch and keys change
      camera, material, crop, layout and application state as one system.
    experienceProgression: A sealed instrument awakens, exposes provenance, escalates into origin selection, rests
      in testimony, becomes a four-phase brew score, and resolves as a subscription stamp.
  continuityContract:
    owner: RoastStage
    medium: hybrid
    sourceOwner: src/experience/RoastStage.jsx
    sectionChanges: One mounted WebGL stage and DOM chapter bus publish hero, provenance, origin, brew and
      subscription states; the chronometer changes camera, material, crop and role without remounting.
    persistenceVerification: Mutation telemetry and a continuous recording prove one canvas and one stage instance
      across controlled progress.
    breakConditions: A second renderer, duplicated instrument, chapter-local canvas, occlusion, lost direct
      navigation or silent mobile deletion breaks continuity.
  experienceArc:
    openingState: A sealed brass-and-steel batch record rests against cold Bergen parchment.
    firstTransformation: Scroll opens calibrated rings and turns the timestamp into a persistent ledger line.
    sectionProgression: The instrument shifts from promise to provenance, origin selector, brewing score and subscription seal.
    peaksAndRests: Origin calibration and brew transmutation are separated by a quiet testimonial rest.
    persistentSystem: RoastStage, one state bus and one GSAP owner preserve the instrument, origin and line.
    userControlledMoment: Drag, swipe, keys or buttons rotate and lock the origin ring.
    mobileTranslation: Short stage beats, thumb-friendly snap rail, reduced geometry and direct controls preserve causality.
    finalResolution: Four brew phases close into a stamped monthly batch record.
  sectionContracts:
    - id: nav
      route: /
      narrativePurpose: Keep orientation and direct task access throughout the route.
      mainUserAction: Open chapter links or mobile menu.
      visualRole: Thin batch index above the stage.
      mediaRole: Current-origin swatch and progress mark.
      interactionRole: Active tracking and focus-trapped menu.
      entryState: Brand and links are immediately visible.
      activeState: Current chapter receives aria-current.
      resolvedState: Navigation lands below the header and closes.
      handoff: Requested chapter publishes to RoastStage.
      mobileBehavior: Fullscreen menu with 48px rows and focus return.
      reducedMotionBehavior: Menu appears directly and anchors are instant.
      fallbackBehavior: Plain semantic anchors remain.
      verificationRequirement: Click all links and test mobile Escape, navigation and focus return.
    - id: hero
      route: /
      narrativePurpose: Introduce freshness as a timestamp and awaken the batch record.
      mainUserAction: Choose beans or brew guide.
      visualRole: Opening spatial peak.
      mediaRole: Roaster plate transforms inside the aperture.
      interactionRole: Scroll unlocks the instrument while CTAs remain conventional.
      entryState: Copy, CTAs and poster are visible.
      activeState: Chronometer opens and media regions separate.
      resolvedState: Instrument aligns to story evidence.
      handoff: Same stage moves into story.
      mobileBehavior: One headline, instrument and CTAs with a short beat.
      reducedMotionBehavior: Resolved open-instrument composition with no pin.
      fallbackBehavior: Poster and semantic hero render.
      verificationRequirement: Capture controlled progress, CTA clicks, mobile and reduced motion.
    - id: story
      route: /
      narrativePurpose: Turn history and sourcing claims into evidence.
      mainUserAction: Read story and four statistics.
      visualRole: Instrument opens into a contract ledger.
      mediaRole: Farm and roaster plates reveal through apertures.
      interactionRole: Scroll changes aperture, data and material.
      entryState: Hero instrument arrives around the first proof.
      activeState: Rings expose four statistics in sequence.
      resolvedState: Origin coordinates populate the selector.
      handoff: Proof ticks become origin berths.
      mobileBehavior: Four sequential beats beside simplified geometry.
      reducedMotionBehavior: Static open-ledger composition.
      fallbackBehavior: Story and statistics remain complete.
      verificationRequirement: Assert copy, statistics, canvas identity and camera change.
    - id: beans
      route: /
      narrativePurpose: Make six coffees genuinely explorable and purchasable.
      mainUserAction: Select an origin and add it to cart.
      visualRole: Main post-hero spatial peak.
      mediaRole: Six distinct plates reconstruct into the selected aperture.
      interactionRole: Drag, swipe, keys and buttons change viewpoint, dossier and cart state.
      entryState: One origin is centered and all six are semantic.
