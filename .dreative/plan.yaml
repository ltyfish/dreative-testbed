  motionAndMediaStrategy: One scoped GSAP and ScrollTrigger owner publishes progress to one R3F stage. Real
    project pixels transform inside calibrated apertures. Lenis is comparison-only and must prove benefit.
    Vanta supplies no code or preset. React Bits supplies interaction vocabulary only.
  mobileTranslation: At 390px the chronometer renders fewer parts at DPR 1.5 on demand; long pins become short
    beats; origin calibration becomes a snap rail with explicit controls. At 320px posters, labels, dossiers
    and actions remain visible. Reduced motion uses authored resolved states.
  functionalTruthRequirements:
    - All content exists in semantic DOM beneath enhancement.
    - Five navigation links target valid section IDs.
    - Mobile menu closes by Escape, backdrop and navigation and returns focus.
    - Six cart buttons produce visible live feedback without alert dialogs.
    - Contact form validates, preserves values on error and shows success.
    - Policy URLs render concise readable articles.
    - Canvas and overlays never intercept unrelated controls.
    - Anchors and keyboard scrolling work with Lenis enabled and disabled.
  performanceBudget:
    - Initial compressed route below 2.8 MB excluding cached fonts.
    - Lazy Three and R3F chunk below 900 KB compressed.
    - Total media below 4 MB and each responsive image below 250 KB.
    - Desktop average at least 55 FPS and worst controlled frame below 40 ms.
    - 390px average at least 45 FPS and worst controlled frame below 55 ms.
    - No long task above 200 ms during selection.
    - Input feedback below 100 ms and origin settle below 700 ms.
    - CLS below 0.1 and no overflow at 320, 390, 768 or 1440.
    - Exactly one GSAP ticker and one WebGL renderer.
    - Pause hidden rendering and cap DPR at 1.5 mobile and 2 desktop.
  acceptanceCriteria:
    - Every treatment has current-build start, active, resolved, mobile and fallback evidence.
    - Hero removal retains origin calibration and brew transmutation.
    - One RoastStage persists across five chapters.
    - Two source-media internal transformations ship, including one after the hero.
    - The spatial signature is recognizable and non-generic.
    - The cinematic arc coordinates at least five channels.
    - Every pointer behavior has touch and keyboard parity.
    - Reduced motion retains authored compositions and all content.
    - All copy, functionality and legal routes survive.
    - Build, console, network, media, accessibility, performance, critic, audit and finalization pass.
    - A fresh independent critic records no blocker or major issue.
    - dreative finalize --codex prints DREATIVE_FINALIZED.
  mechanismFallbacks:
    - id: roast-stage-fallback
      location: home hero through subscribe
      primaryImplementation: Catalogue shared-3d-object-across-sections transformed into a Northwind roast
        chronometer. using the declared primary dependency.
      primaryAcceptance: &a1
        - Recognizable multi-part instrument.
        - One stage across five chapters.
        - Camera, light, depth and material change.
      fallbackImplementation: Responsive pre-rendered chronometer states over semantic DOM.
      fallbackTrigger: WebGL loss, mobile FPS below 40 or frame-time budget breach.
      triggerEvidenceRequired:
        - Runtime trace.
        - Controlled browser captures.
        - Current-build performance or failure evidence.
      userReapprovalRequired: false
      allowedSubstitutions:
        - pre-rendered-angles
        - frame-sequence
      riskFamily: roast-stage runtime and experience risk.
      prototypePolicy: Required combined vertical-slice probe before integration.
    - id: batch-journey-fallback
      location: home hero through subscribe
      primaryImplementation: Catalogue persistent-object and reversible timeline using scoped GSAP and
        ScrollTrigger. using the declared primary dependency.
      primaryAcceptance: &a2
        - Setup, escalation, rest and resolution.
        - Two post-hero transformations.
        - One clock.
      fallbackImplementation: Native flow with direct chapter states.
      fallbackTrigger: Unresolved anchor, keyboard, resize or pin-release failure.
      triggerEvidenceRequired:
        - Runtime trace.
        - Controlled browser captures.
        - Current-build performance or failure evidence.
      userReapprovalRequired: false
      allowedSubstitutions:
        - declared semantic fallback
