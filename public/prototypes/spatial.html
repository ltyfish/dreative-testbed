<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Northwind spatial roast chamber</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle,#4b2518,#15130f 55%);color:#eee7d9;font:12px monospace}
    main{min-height:100vh;padding:5vw;display:grid;grid-template-columns:1fr 1fr;align-items:center}
    h1{font:normal clamp(64px,9vw,130px)/.85 Georgia,serif;margin:12px 0}em{color:#d8ef62}.copy p{max-width:480px;line-height:1.8}
    .chamber{aspect-ratio:1;display:grid;place-items:center;position:relative;perspective:900px}.ring{position:absolute;width:80%;height:48%;border:1px solid #f0642b;border-radius:50%;transform:rotateX(62deg);box-shadow:0 0 80px #f0642b55}
    .ring:after{content:"";position:absolute;inset:22%;border:1px dashed #ffffff40;border-radius:50%}.bean{width:110px;height:155px;border-radius:49%;background:linear-gradient(145deg,#a7b774,#3f4c2b);box-shadow:inset -24px -18px 35px #0009,0 25px 80px #000;transform:rotate(22deg);position:relative}
    .bean:after{content:"";position:absolute;left:48%;top:8%;width:7%;height:84%;background:#1d2415aa;border-radius:50%}.facts{position:absolute;bottom:7%;display:flex;gap:40px}.facts strong{font:28px Georgia;display:block}
    @media(max-width:700px){main{grid-template-columns:1fr;padding:24px}.chamber{order:-1}.facts{gap:18px}}
  </style>
</head>
<body><main><section class="copy"><p>PROTOTYPE B / SPATIAL CHAMBER</p><h1>The bean <em>changes.</em></h1><p>One selected origin changes orientation, scale, material, heat response, and live roast metadata through charge, drying, first crack, and drop.</p></section><section class="chamber"><div class="ring"></div><div class="bean"></div><div class="facts"><div><strong>154°</strong>BEAN TEMP.</div><div><strong>04:20</strong>ROAST TIME</div><div><strong>7%</strong>MASS LOSS</div></div></section></main></body>
</html>
